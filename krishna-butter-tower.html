<title>Krishna's Butter Tower</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Alegreya:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
/* Layout: one storybook stage framed like a little puppet theatre, narration strip beneath, footlight controls and a scene timeline. Single deliberate night-indigo look. */
:root{
  color-scheme:dark;
  --night:#121836; --night-2:#1e2856; --panel:#1a2148;
  --ink:#f7ecd6; --ink-dim:#c4bba6;
  --saffron:#f3a73b; --peacock:#2a9d8f; --lotus:#e76f8c; --butter:#fff6d8;
  --display:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --body:'Alegreya',Georgia,'Times New Roman',serif;
}
html,body{background:var(--night);color:var(--ink)}
body{font-family:var(--body);padding-inline:16px;padding-block:20px 36px;background:radial-gradient(ellipse at 50% -10%,var(--night-2),var(--night) 65%) var(--night)}
.wrap{max-width:960px;margin:0 auto;display:grid;gap:14px}
header{display:grid;gap:2px}
header h1{font-family:var(--display);font-weight:800;font-size:clamp(1.45rem,3.6vw,2.25rem);line-height:1.05;margin:0;color:var(--saffron);text-wrap:balance}
header p{margin:0;color:var(--ink-dim);font-style:italic;font-size:1.02rem}

.stage{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:14px;overflow:hidden;background:#000;container-type:inline-size;
  box-shadow:0 0 0 3px #3b2a12,0 0 0 7px var(--saffron),0 0 0 10px #3b2a12,0 20px 50px rgba(0,0,0,.55)}
.stage svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.layer{position:absolute;inset:0;pointer-events:none}

.bubble{position:absolute;transform:translate(-50%,-100%) scale(.5);opacity:0;transition:opacity .22s,transform .32s cubic-bezier(.3,1.6,.5,1);
  background:#fffaf0;color:#2b1d0e;font-family:var(--display);font-weight:600;font-size:clamp(10px,1.95cqw,18px);line-height:1.2;
  padding:.45em .8em;border-radius:1em;width:max-content;max-width:32cqw;text-align:center;border:2px solid #2b1d0e;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.bubble::after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:12px;background:inherit;border-right:2px solid #2b1d0e;border-bottom:2px solid #2b1d0e;transform:translateX(-50%) rotate(45deg)}
.bubble.show{opacity:1;transform:translate(-50%,-100%) scale(1)}
.bubble.shout{font-weight:800;font-size:clamp(13px,3.1cqw,30px);background:#ffe066;letter-spacing:.01em}
.bubble.shout.show{animation:jolt .18s 4 alternate}
.bubble.tag{background:var(--saffron);font-size:clamp(9px,1.45cqw,14px);padding:.15em .6em;border-radius:99px;box-shadow:none}
.bubble.tag::after{display:none}
@keyframes jolt{from{margin-left:-3px}to{margin-left:3px}}

.card{position:absolute;left:50%;top:9%;transform:translateX(-50%);text-align:center;width:90%;transition:opacity .5s}
.card h2{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(20px,5.4cqw,54px);line-height:1.02;color:#fff6d8;text-wrap:balance;
  text-shadow:0 3px 0 #7a3b12,0 6px 18px rgba(0,0,0,.45)}
.card p{margin:.35em 0 0;font-style:italic;font-size:clamp(12px,2.2cqw,21px);color:#fff1cf;text-shadow:0 2px 6px rgba(0,0,0,.6)}
.card.fade{opacity:0}

.start{position:absolute;left:50%;top:62%;transform:translate(-50%,-50%);pointer-events:auto;display:flex;align-items:center;gap:.5em;
  font-family:var(--display);font-weight:800;font-size:clamp(14px,2.6cqw,24px);color:#2b1d0e;background:var(--saffron);border:3px solid #2b1d0e;
  border-radius:99px;padding:.4em 1.2em .35em;cursor:pointer;box-shadow:0 4px 0 #2b1d0e}
.start:hover{background:#ffbe57}
.start:focus-visible,.ctl button:focus-visible,.seg:focus-visible{outline:3px solid var(--butter);outline-offset:2px}

.narration{background:var(--panel);border-radius:12px;padding:14px 18px;display:grid;gap:4px;min-height:6.4em;border:1px solid #2c376b}
.narration small{font-family:var(--display);font-weight:600;font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;color:var(--peacock)}
.narration p{margin:0;font-size:clamp(1.05rem,2.3vw,1.3rem);line-height:1.5;max-width:65ch;text-wrap:pretty}

.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.ctl button{font-family:var(--display);font-weight:600;font-size:1rem;color:var(--ink);background:#25306a;border:1px solid #3a4787;border-radius:10px;padding:.42em .95em .32em;cursor:pointer}
.ctl button:hover{background:#2f3c80}
.ctl button.primary{background:var(--saffron);color:#2b1d0e;border-color:#ffc56b;font-weight:800;min-width:6.5em}
.ctl button[aria-pressed="true"]{background:var(--peacock);border-color:#47c2b3;color:#08201d}
.ctl .spacer{flex:1}
.track{display:flex;gap:4px}
.seg{position:relative;height:10px;border-radius:99px;background:#2a3470;overflow:hidden;border:0;padding:0;cursor:pointer;min-width:0}
.seg i{position:absolute;inset:0 auto 0 0;width:0;background:var(--saffron);border-radius:99px}
.seg.done i{width:100%;background:#c9853a}
.foot{color:var(--ink-dim);font-size:.92rem;margin:0}

/* ---------- SVG motion ---------- */
.paused *{animation-play-state:paused!important}
.blink{animation:blink 4.2s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.arm{transform-box:fill-box;transform-origin:50% 4px;transform:rotate(var(--a))}
.scoop{animation:scoop .7s ease-in-out infinite}
@keyframes scoop{0%,100%{transform:rotate(var(--a))}50%{transform:rotate(calc(var(--a) + 28deg))}}
.feather{transform-box:fill-box;transform-origin:50% 100%;animation:sway 2.2s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
.bob{animation:bob 1.5s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-4px)}}
.tiptoe{animation:tip .42s ease-in-out infinite alternate;animation-delay:var(--d,0s)}
@keyframes tip{from{transform:translateY(0)}to{transform:translateY(-9px)}}
.walk{animation:walk 8.2s linear both}
@keyframes walk{from{transform:translateX(-70px)}to{transform:translateX(1320px)}}
.sunrise{animation:rise 6s ease-out both}
@keyframes rise{from{transform:translateY(120px)}to{transform:translateY(0)}}
.shimmer{animation:shim 2.6s ease-in-out infinite alternate}
@keyframes shim{from{transform:translateX(-10px);opacity:.6}to{transform:translateX(12px);opacity:1}}
.fan{transform-box:fill-box;transform-origin:50% 100%;animation:fan 1.1s ease-in-out infinite alternate}
@keyframes fan{from{transform:scale(.72,.62)}to{transform:scale(1.04)}}
.fanrest{transform-box:fill-box;transform-origin:50% 100%;transform:scale(.48,.42)}
.nod{transform-box:fill-box;transform-origin:50% 0;animation:nod 1.4s ease-in-out infinite alternate}
@keyframes nod{from{transform:rotate(-6deg)}to{transform:rotate(8deg)}}
.churn{transform-box:fill-box;transform-origin:50% 100%;animation:churn .42s ease-in-out infinite alternate}
@keyframes churn{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.yexit{animation:yexit 2.2s ease-in both;animation-delay:var(--d)}
@keyframes yexit{to{transform:translateX(560px)}}
.pop{animation:pop .7s cubic-bezier(.3,1.5,.5,1) both;animation-delay:var(--d)}
@keyframes pop{from{transform:translateY(140px)}to{transform:translateY(0)}}
.swingdown{transform-box:fill-box;transform-origin:50% 0;animation:swingdown 1.5s ease-out both;animation-delay:var(--d)}
@keyframes swingdown{0%{transform:translateY(-300px) rotate(-35deg)}55%{transform:translateY(12px) rotate(12deg)}80%{transform:translateY(-6px) rotate(-4deg)}100%{transform:none}}
.drop{animation:drop .65s cubic-bezier(.3,1.4,.5,1) both;animation-delay:var(--d)}
@keyframes drop{from{transform:translateY(-70px);opacity:0}to{transform:none;opacity:1}}
.wob{transform-box:view-box;transform-origin:400px 432px;animation:wob 1s ease-in-out infinite alternate;animation-delay:var(--d,0s)}
@keyframes wob{from{transform:rotate(-2.6deg)}to{transform:rotate(2.6deg)}}
.potswing{transform-box:view-box;transform-origin:var(--ox) var(--oy);animation:potswing 2s ease-in-out infinite alternate}
@keyframes potswing{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.tumble{transform-box:fill-box;transform-origin:center;animation:tumble 2.6s ease-in both;animation-delay:var(--d)}
@keyframes tumble{0%{transform:none}35%{transform:translate(var(--dx),var(--dy)) rotate(var(--r))}100%{transform:translate(var(--dx2),var(--dy)) rotate(var(--r2));opacity:0}}
.kdrop{animation:kdrop .9s cubic-bezier(.5,0,.7,1.3) both;animation-delay:var(--d)}
@keyframes kdrop{to{transform:translateY(var(--dy))}}
.leap{animation:leap 1.4s ease-in both;animation-delay:var(--d)}
@keyframes leap{50%{transform:translate(var(--dx),var(--dy))}100%{transform:translate(var(--dx2),var(--dy2));opacity:0}}
.fadein{animation:fadein .6s ease both;animation-delay:var(--d)}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.fadeout{animation:fadeout .45s ease both;animation-delay:var(--d)}
@keyframes fadeout{from{opacity:1}to{opacity:0}}
.laughbob{animation:laugh .32s ease-in-out infinite alternate}
@keyframes laugh{to{transform:translateY(-4px) rotate(1.5deg)}}
.tear{animation:tear 1.2s ease-in infinite}
@keyframes tear{from{transform:translateY(0);opacity:1}to{transform:translateY(18px);opacity:0}}
.twinkle{animation:tw 1.8s ease-in-out infinite alternate;animation-delay:var(--d,0s)}
@keyframes tw{from{opacity:.25}to{opacity:1}}
.ants{animation:ants 9s linear infinite}
@keyframes ants{from{transform:translateX(0)}to{transform:translateX(-220px)}}
@media (prefers-reduced-motion:reduce){.blink,.shimmer,.twinkle,.laughbob,.bubble.shout.show{animation:none}}
@media (max-width:520px){.ctl .spacer{display:none}.ctl button{font-size:.92rem;padding:.38em .75em .3em}}
</style>

<div class="wrap">
  <header>
    <h1>Little Krishna and the Butter Tower</h1>
    <p>An animated storybook from Gokul, in twelve little scenes.</p>
  </header>

  <div class="stage" id="stage">
    <svg viewBox="0 0 800 450" role="img" aria-label="Animated story scene" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="skyDawn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f29b5c"/><stop offset=".55" stop-color="#ffd59a"/><stop offset="1" stop-color="#ffeccc"/></linearGradient>
        <linearGradient id="skyDay" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#86cdee"/><stop offset="1" stop-color="#e6f6ff"/></linearGradient>
        <linearGradient id="skyNight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0f2e"/><stop offset="1" stop-color="#26346f"/></linearGradient>
        <radialGradient id="sunGlow"><stop offset="0" stop-color="#ffe7a3" stop-opacity=".95"/><stop offset="1" stop-color="#ffe7a3" stop-opacity="0"/></radialGradient>
        <radialGradient id="moonGlow"><stop offset="0" stop-color="#fff8dc" stop-opacity=".55"/><stop offset="1" stop-color="#fff8dc" stop-opacity="0"/></radialGradient>
        <radialGradient id="potGlow"><stop offset="0" stop-color="#ffe7a3" stop-opacity=".6"/><stop offset="1" stop-color="#ffe7a3" stop-opacity="0"/></radialGradient>
        <linearGradient id="riverGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7cf72"/><stop offset="1" stop-color="#d98f3a"/></linearGradient>
        <linearGradient id="riverNight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22327a"/><stop offset="1" stop-color="#0e1640"/></linearGradient>
        <linearGradient id="wallA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ecc085"/><stop offset="1" stop-color="#d59b5b"/></linearGradient>
        <linearGradient id="wallB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eab0a2"/><stop offset="1" stop-color="#cc8274"/></linearGradient>
        <radialGradient id="doorLight" cx=".5" cy=".7" r=".8"><stop offset="0" stop-color="#fff6cf"/><stop offset="1" stop-color="#f6c063"/></radialGradient>
      </defs>
      <g id="scene"></g>
      <g id="fx"></g>
    </svg>
    <div class="layer" id="bubbles"></div>
    <div class="layer" id="cardLayer"><div class="card" id="card"><h2 id="cardTitle"></h2><p id="cardSub"></p></div></div>
    <div class="layer"><button class="start" id="startBtn" type="button">&#9654; Play the story</button></div>
  </div>

  <div class="track" id="track" aria-label="Scenes"></div>

  <div class="narration" aria-live="polite">
    <small id="sceneLabel">Scene 1 of 12</small>
    <p id="caption"></p>
  </div>

  <div class="ctl">
    <button id="prevBtn" type="button" aria-label="Previous scene">&#9664; Back</button>
    <button id="playBtn" type="button" class="primary">&#9654; Play</button>
    <button id="nextBtn" type="button" aria-label="Next scene">Next &#9654;</button>
    <span class="spacer"></span>
    <button id="voiceBtn" type="button" aria-pressed="false">Read aloud</button>
    <button id="restartBtn" type="button">Start over</button>
  </div>
  <p class="foot">Tip: press the space bar to pause, and the arrow keys to move between scenes. Turn on Read aloud to hear the narration and the characters.</p>
</div>

<script>
/* ================= drawing helpers ================= */
const HAIR='#1b1220';
const at=(x,y,s,inner,cls='',style='')=>`<g transform="translate(${x} ${y}) scale(${s})"><g class="${cls}" style="${style}">${inner}</g></g>`;
const P=(o,e)=>Object.assign({},o,e);

function face(eyes='open',mouth='smile'){
  let e='',m='';
  if(eyes==='open'||eyes==='wide'){
    const rx=eyes==='wide'?4:3.2, ry=eyes==='wide'?5.3:4, hl=eyes==='wide'?1.7:1.1;
    e=`<g class="blink"><ellipse cx="-8" cy="-114" rx="${rx}" ry="${ry}" fill="${HAIR}"/><ellipse cx="8" cy="-114" rx="${rx}" ry="${ry}" fill="${HAIR}"/><circle cx="-6.7" cy="-115.8" r="${hl}" fill="#fff"/><circle cx="9.3" cy="-115.8" r="${hl}" fill="#fff"/></g>`;
  } else if(eyes==='closed'){
    e=`<path d="M-12 -113 Q-8 -118 -4 -113 M4 -113 Q8 -118 12 -113" stroke="${HAIR}" stroke-width="1.9" fill="none" stroke-linecap="round"/>`;
  } else if(eyes==='laugh'){
    e=`<path d="M-12 -111 L-5 -114.5 L-12 -118 M12 -111 L5 -114.5 L12 -118" stroke="${HAIR}" stroke-width="1.9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
  } else if(eyes==='sleepy'){
    e=`<path d="M-12 -113 Q-8 -110 -4 -113 M4 -113 Q8 -110 12 -113" stroke="${HAIR}" stroke-width="1.9" fill="none" stroke-linecap="round"/>`;
  }
  const dark='#5a1f1f';
  if(mouth==='smile') m=`<path d="M-7 -103 Q0 -96 7 -103" stroke="${dark}" stroke-width="2" fill="none" stroke-linecap="round"/>`;
  else if(mouth==='grin') m=`<path d="M-9 -104 Q0 -91 9 -104Z" fill="${dark}"/><path d="M-6 -101 Q0 -98 6 -101" stroke="#e57373" stroke-width="2" fill="none"/>`;
  else if(mouth==='o') m=`<circle cx="1" cy="-101" r="3.1" fill="${dark}"/>`;
  else if(mouth==='open') m=`<ellipse cx="0" cy="-100" rx="6.2" ry="5.6" fill="${dark}"/><ellipse cx="0" cy="-97.6" rx="3.6" ry="2" fill="#e57373"/>`;
  else if(mouth==='frown') m=`<path d="M-6 -99 Q0 -104 6 -99" stroke="${dark}" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M-13 -124 L-4 -121 M13 -124 L4 -121" stroke="${HAIR}" stroke-width="2.2" stroke-linecap="round"/>`;
  return e+m;
}

function kid(o={}){
  const s=o.skin||'#c98b5e', c=o.cloth||'#d9534f', w=o.wide?5:0, dy=o.sit?22:0;
  const legs=o.sit
    ?`<ellipse cx="0" cy="-9" rx="${32+w}" ry="11" fill="${c}"/><ellipse cx="-25" cy="-4" rx="8" ry="5" fill="${s}"/><ellipse cx="25" cy="-4" rx="8" ry="5" fill="${s}"/>`
    :`<rect x="-13" y="-44" width="10" height="42" rx="4" fill="${s}"/><rect x="3" y="-44" width="10" height="42" rx="4" fill="${s}"/><ellipse cx="-10" cy="-2" rx="9" ry="4" fill="${s}"/><ellipse cx="10" cy="-2" rx="9" ry="4" fill="${s}"/>`;
  const dhoti=o.sit?'':`<path d="M${-19-w} -66 L${19+w} -66 L${23+w} -34 Q0 -28 ${-23-w} -34Z" fill="${c}"/>`;
  const arm=(side,deg,cls)=>{const x=side<0?-26-w:17+w;return `<rect class="arm ${cls||''}" style="--a:${deg}deg" x="${x}" y="-92" width="9" height="36" rx="4.5" fill="${s}"/>`;};
  const curls=o.krishna?[[-21,-127,7],[-11,-137,7.5],[3,-140,7.5],[16,-134,7],[23,-121,6],[-25,-115,6]].map(([x,y,r])=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${HAIR}"/>`).join(''):'';
  const topknot=o.topknot?`<circle cx="0" cy="-143" r="7" fill="${HAIR}"/>`:'';
  const crown=o.krishna?`<path d="M-19 -131 Q0 -140 19 -131 L17 -126 Q0 -134 -17 -126Z" fill="#f6c945"/><circle cx="0" cy="-133" r="2.4" fill="#e04f5f"/>
    <g transform="translate(9 -136) rotate(16)"><g class="feather"><path d="M0 0 C-9 -16 -8 -36 0 -46 C8 -36 9 -16 0 0Z" fill="#1f8a5b"/><ellipse cx="0" cy="-31" rx="5.5" ry="7.5" fill="#2a6fd6"/><ellipse cx="0" cy="-31" rx="3" ry="4" fill="#123d8a"/><circle cx="0" cy="-31" r="1.6" fill="#f2c94c"/></g></g>
    <path d="M-3 -126 L0 -119.5 L3 -126" stroke="#f6c945" stroke-width="1.6" fill="none"/>`:'';
  const necklace=o.necklace?`<path d="M-12 -95 Q0 -82 12 -95" stroke="#f6c945" stroke-width="3" fill="none" stroke-dasharray="1 3.4" stroke-linecap="round"/>`:'';
  const sash=o.sash?`<path d="M-13 -93 L15 -66" stroke="${o.sash}" stroke-width="5" stroke-linecap="round"/>`:'';
  const butter=o.butter?`<g fill="var(--butter)" stroke="#e7cf88" stroke-width=".8"><ellipse cx="-13" cy="-104" rx="6.5" ry="4.5"/><ellipse cx="4" cy="-94" rx="7" ry="4"/><ellipse cx="9" cy="-78" rx="9" ry="5.5"/><circle cx="15" cy="-113" r="3.6"/><circle cx="-6" cy="-84" r="3"/></g>`:'';
  const sparkle=o.sparkle?`<path class="twinkle" d="M-22 -132 l1.4 3.6 3.6 1.4 -3.6 1.4 -1.4 3.6 -1.4 -3.6 -3.6 -1.4 3.6 -1.4Z" fill="#fff"/><path class="twinkle" style="--d:.7s" d="M24 -128 l1.2 3 3 1.2 -3 1.2 -1.2 3 -1.2 -3 -3 -1.2 3 -1.2Z" fill="#fff"/>`:'';
  const chin=o.chin?`<circle cx="-8" cy="-93" r="5.5" fill="${s}"/><circle cx="8" cy="-93" r="5.5" fill="${s}"/>`:'';
  const flute=o.flute?`<path d="M2 -101 L66 -88" stroke="#8b5a2b" stroke-width="4.5" stroke-linecap="round"/><path d="M14 -98.6 L14 -98.6 M28 -95.8 L28 -95.8 M44 -92.6 L44 -92.6" stroke="#3b220f" stroke-width="2.4" stroke-linecap="round"/><path d="M56 -90 l3 .6" stroke="#f6c945" stroke-width="5"/>`:'';
  return `<g>${legs}<g transform="translate(0 ${dy})">${dhoti}
    ${arm(-1,o.aL??14,o.aLc)}${arm(1,o.aR??-14,o.aRc)}
    <rect x="${-17-w}" y="-96" width="${34+2*w}" height="34" rx="13" fill="${s}"/>
    <rect x="${-17-w}" y="-70" width="${34+2*w}" height="8" fill="${c}"/>${sash}${necklace}
    <ellipse cx="-23" cy="-112" rx="4" ry="6" fill="${s}"/><ellipse cx="23" cy="-112" rx="4" ry="6" fill="${s}"/>
    ${topknot}<circle cx="0" cy="-114" r="23" fill="${s}"/>
    <path d="M-24 -112 C-28 -140 -10 -146 0 -144 C12 -146 28 -140 24 -112 C20 -126 10 -132 0 -131 C-10 -132 -20 -126 -24 -112Z" fill="${HAIR}"/>${curls}${crown}
    <circle cx="-14" cy="-105" r="${o.round?6.8:4.6}" fill="#ef7f8f" opacity=".45"/><circle cx="14" cy="-105" r="${o.round?6.8:4.6}" fill="#ef7f8f" opacity=".45"/>
    ${face(o.eyes||'open',o.mouth||'smile')}${chin}${flute}${butter}${sparkle}
  </g></g>`;
}

function woman(o={}){
  const s=o.skin||'#c58a5c', sari=o.sari, bl=o.blouse, bd=o.border||'#f6c945', dy=o.sit?58:0;
  const lower=o.sit
    ?`<ellipse cx="0" cy="-14" rx="56" ry="17" fill="${sari}"/><path d="M-54 -12 Q0 5 54 -12" stroke="${bd}" stroke-width="3" fill="none"/><ellipse cx="-44" cy="-5" rx="9" ry="5" fill="${s}"/>`
    :`<ellipse cx="-12" cy="-3" rx="9" ry="4" fill="${s}"/><ellipse cx="12" cy="-3" rx="9" ry="4" fill="${s}"/><path d="M-30 -100 Q-36 -44 -42 -5 L42 -5 Q36 -44 30 -100Z" fill="${sari}"/><path d="M-42 -9 L42 -9" stroke="${bd}" stroke-width="4"/><path d="M-4 -96 L-8 -12 M8 -96 L10 -12" stroke="#000" stroke-opacity=".15" stroke-width="2"/>`;

const TW=(()=>{const crew=[['B',.95,BAL],['S',.86,SHR],['M',.86,MAD],['K',.82,KR]];let y=432;const pos={};
  for(const [id,s,o] of crew){pos[id]={x:id==='K'?394:400,y,s,o};y-=88*s;}
  const K=pos.K, hand={x:K.x+30.8*K.s, y:K.y-124.8*K.s};
  return {pos,hand,pot:{x:hand.x+18,y:hand.y-25}};})();
function towerSVG(mode){
  const p=TW.pos, raise={aL:162,aR:-162};
  const ko=mode==='who'?{aL:150,aR:-150,eyes:'wide',mouth:'o',butter:true}:mode==='butter'?{aL:150,aR:-165,aRc:'scoop',mouth:'grin'}:{aL:150,aR:-165,mouth:'grin'};
  const opts={B:P(BAL,P(raise,{mouth:mode==='build'?'smile':'grin'})),S:P(SHR,P(raise,{mouth:'grin',butter:mode!=='build'})),M:P(MAD,P(raise,{mouth:'open',eyes:mode==='build'?'open':'laugh'})),K:P(KR,ko)};
  const build={B:2.5,S:3.6,M:5.0,K:8.0};
  const tum={B:{dx:-240,dy:0,r:-90,dx2:-700,r2:-420},S:{dx:230,dy:84,r:100,dx2:720,r2:440},M:{dx:-160,dy:160,r:-120,dx2:-680,r2:-480}};
  let out='';
  for(const id of ['B','S','M','K']){
    const q=p[id], inner=kid(opts[id]);
    if(mode==='build') out+=at(q.x,q.y,q.s,inner,'drop',`--d:${build[id]}s`);
    else if(mode==='who'){
      if(id==='K') out+=at(q.x,q.y,q.s,inner,'kdrop',`--d:1.7s;--dy:${((432-q.y)/q.s).toFixed(1)}px`);
      else{const t=tum[id];out+=at(q.x,q.y,q.s,inner,'tumble',`--d:1.6s;--dx:${(t.dx/q.s).toFixed(1)}px;--dy:${(t.dy/q.s).toFixed(1)}px;--r:${t.r}deg;--dx2:${(t.dx2/q.s).toFixed(1)}px;--r2:${t.r2}deg`);}
    } else out+=at(q.x,q.y,q.s,inner);
  }
  return out;
}

const note=(x,y,o,g,size=20)=>`<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" font-size="${size}" fill="#fff6d8" stroke="#2b1d0e" stroke-width=".8" opacity="${o.toFixed(2)}" font-family="serif">${g}</text>`;
function whistleFx(t,x0,y0,t0,t1){let s='';for(let k=0;k<7;k++){const tk=t-t0-k*.32;if(tk<0||t0+k*.32>t1)continue;const p=tk/1.6;if(p>1)continue;s+=note(x0+p*50+Math.sin(p*7+k)*7,y0-p*80,1-p,k%2?'♫':'♪',18);}return s;}
function churnFx(t){let s='';for(let k=0;k<7;k++){const ph=(t*.32+k/7)%1;const x=330+Math.sin(ph*6+k)*14,y=372-ph*95,r=5+ph*11;s+=`<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="${(r*1.3).toFixed(1)}" ry="${r.toFixed(1)}" fill="var(--butter)" opacity="${((1-ph)*.85).toFixed(2)}"/>`;}return s;}
function fluteFx(t,x0,y0){let s='';if(t<.6)return s;for(let k=0;k<9;k++){const ph=((t-.6)*.26+k/9)%1;s+=note(x0+ph*130+Math.sin(ph*8+k)*14,y0-ph*200,Math.sin(Math.PI*ph),k%3?'♪':'♫',16+ph*10);}return s;}
const LAUNCH=[[1.0,140,378],[1.7,400,250],[2.4,215,384],[3.1,675,382],[3.8,402,316],[4.5,300,446],[5.2,520,447],[5.9,142,380],[6.6,676,383],[7.2,400,175]];
function butterFx(t){const h=TW.hand;let s='';
  for(const [t0,tx,ty] of LAUNCH){const dt=t-t0;if(dt<0)continue;const p=Math.min(dt/.85,1);const x=h.x+(tx-h.x)*p,y=h.y+(ty-h.y)*p-Math.sin(Math.PI*p)*90;
    s+=p<1?`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="7.5" fill="var(--butter)" stroke="#e7cf88"/><circle cx="${(x-2).toFixed(1)}" cy="${(y-2.5).toFixed(1)}" r="2.2" fill="#fff"/>`
           :`<ellipse cx="${tx}" cy="${ty}" rx="9" ry="5" fill="var(--butter)" stroke="#e7cf88"/><circle cx="${tx+7}" cy="${ty-3}" r="3" fill="var(--butter)"/>`;}
  return s;}

/* ================= player ================= */
const $=id=>document.getElementById(id);
const sceneEl=$('scene'), fxEl=$('fx'), bubLayer=$('bubbles'), stage=$('stage'), cap=$('caption'), lab=$('sceneLabel');
const card=$('card'), cardTitle=$('cardTitle'), cardSub=$('cardSub'), startBtn=$('startBtn'), playBtn=$('playBtn'), voiceBtn=$('voiceBtn'), track=$('track');
const synth=('speechSynthesis' in window)?window.speechSynthesis:null;
if(!synth) voiceBtn.hidden=true;
let idx=0,t=0,playing=false,last=null,curLine=-1,ended=false,voiceOn=false,started=false,spoken=new Set();

track.innerHTML=SCENES.map((s,i)=>`<button class="seg" type="button" style="flex:${s.dur}" aria-label="Go to scene ${i+1}" data-i="${i}"><i></i></button>`).join('');
const segs=[...track.children];
segs.forEach(b=>b.addEventListener('click',()=>{ensureStarted();load(+b.dataset.i);}));

function say(text){
  if(!synth||!voiceOn)return;
  try{const u=new SpeechSynthesisUtterance(text.replace(/[“”]/g,''));u.rate=.92;u.pitch=1.05;synth.speak(u);}catch(e){}
}
function load(i){
  idx=i;t=0;curLine=-1;ended=false;spoken=new Set();
  if(synth)try{synth.cancel();}catch(e){}
  const sc=SCENES[i];
  sceneEl.innerHTML=sc.build();
  fxEl.innerHTML='';
  bubLayer.innerHTML=(sc.bubbles||[]).map((b,k)=>`<div class="bubble ${b.cls||''}" data-k="${k}" style="left:${(b.x/8).toFixed(2)}%;top:${(b.y/4.5).toFixed(2)}%">${b.text}</div>`).join('');
  if(sc.card){cardTitle.textContent=sc.card.title;cardSub.textContent=sc.card.sub;}
  lab.textContent=`Scene ${i+1} of ${SCENES.length}`;
  segs.forEach((s,k)=>{s.classList.toggle('done',k<i);s.firstChild.style.width=k<i?'100%':'0';});
  update();
}
function update(){
  const sc=SCENES[idx];
  let li=-1;sc.lines.forEach((l,k)=>{if(t>=l[0])li=k;});
  if(li!==curLine){curLine=li;cap.textContent=li>=0?sc.lines[li][1]:'';if(playing&&li>=0)say(sc.lines[li][1]);}
  [...bubLayer.children].forEach(el=>{const b=sc.bubbles[+el.dataset.k];const on=t>=b.t&&t<b.u;
    if(on&&!el.classList.contains('show')){el.classList.add('show');if(playing&&b.cls!=='tag'&&!spoken.has(el.dataset.k)){spoken.add(el.dataset.k);say(b.text);}}
    else if(!on)el.classList.remove('show');});
  const c=sc.card;card.parentElement.hidden=!c;if(c)card.classList.toggle('fade',!(t>=c.t&&t<c.u));
  fxEl.innerHTML=sc.fx?sc.fx(t):'';
  segs[idx].firstChild.style.width=Math.min(100,t/sc.dur*100)+'%';
}
function setPlaying(p){
  playing=p;stage.classList.toggle('paused',!p);
  playBtn.innerHTML=p?'&#10074;&#10074; Pause':(ended?'&#8635; Again':'&#9654; Play');
  if(synth)try{p?synth.resume():synth.pause();}catch(e){}
}
function ensureStarted(){if(!started){started=true;startBtn.parentElement.hidden=true;}}
function loop(ts){
  if(playing){
    if(last!==null)t+=Math.min(.1,(ts-last)/1000);
    last=ts;
    const sc=SCENES[idx];
    const talking=voiceOn&&synth&&synth.speaking;
    if(t>=sc.dur&&!talking){
      if(idx<SCENES.length-1)load(idx+1);
      else{t=sc.dur;ended=true;setPlaying(false);}
    }
    update();
  } else last=null;
  requestAnimationFrame(loop);
}
startBtn.addEventListener('click',()=>{ensureStarted();load(0);setPlaying(true);});
playBtn.addEventListener('click',()=>{ensureStarted();if(ended){load(0);setPlaying(true);}else setPlaying(!playing);});
$('nextBtn').addEventListener('click',()=>{ensureStarted();if(idx<SCENES.length-1)load(idx+1);});
$('prevBtn').addEventListener('click',()=>{ensureStarted();load(Math.max(0,idx-1));});
$('restartBtn').addEventListener('click',()=>{ensureStarted();load(0);setPlaying(true);});
voiceBtn.addEventListener('click',()=>{voiceOn=!voiceOn;voiceBtn.setAttribute('aria-pressed',voiceOn);
  if(voiceOn){if(curLine>=0)say(SCENES[idx].lines[curLine][1]);}else if(synth)try{synth.cancel();}catch(e){}});
document.addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('button')&&e.key===' ')return;
  if(e.key===' '){e.preventDefault();playBtn.click();}
  else if(e.key==='ArrowRight')$('nextBtn').click();
  else if(e.key==='ArrowLeft')$('prevBtn').click();
});
load(0);setPlaying(false);
requestAnimationFrame(loop);
</script>
